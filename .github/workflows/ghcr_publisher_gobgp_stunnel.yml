name: Publish gobgp stunnel container

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (e.g. v1.0.0)'
        required: true
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/gobgp-stunnel

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'
          cache-dependency-path: '**/go.sum'

      - name: Generate Dockerfile dynamically
        run: |
          cat <<'DOCKER' > Dockerfile
          FROM golang:1.23 AS builder
          # Pin gobgp to a specific version to avoid unexpected changes
          RUN go install github.com/osrg/gobgp/v3/cmd/gobgpd@v3.37.0 \
              && go install github.com/osrg/gobgp/v3/cmd/gobgp@v3.37.0

          FROM ubuntu:latest
          RUN apt-get update && \
              apt-get install -y stunnel && \
              apt-get clean && rm -rf /var/lib/apt/lists/*
          COPY --from=builder /go/bin/gobgpd /usr/local/bin/gobgpd
          COPY --from=builder /go/bin/gobgp /usr/local/bin/gobgp
          ENTRYPOINT ["/usr/local/bin/gobgpd"]
          DOCKER

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.image_tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}